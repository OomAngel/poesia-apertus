# Angel's rule (2026-10-06): no commit names Claude or Anthropic as author or committer, or
# carries a Co-Authored-By naming them, a Claude-Session trailer or a "Generated with Claude
# Code" line.
# Commit tier (ci-infra docs/AGENT_KIT.md, "Tiers"): every static check of the changed files.
# Each hook was run over the whole repository at 0 findings before it was added (2026-10-07).
# Install once per clone: pre-commit install
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/OomAngel/pre-commit-hooks
    rev: v1.3.1
    hooks:
      - id: no-ai-attribution

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
        # The linking vectors (float16, 1-6 MB) are needed by the Docker build (COPY data/linking).
        exclude: ^track_2b/data/linking/vectors_[a-z]+\.npy$
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
        exclude: ^LICENSE$
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^LICENSE$
      - id: mixed-line-ending
        args: [--fix=no]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
