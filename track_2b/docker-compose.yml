# `docker compose up` (CPU) or ./run.sh / .\run.ps1 / make run (GPU when available): the model
# (Ollama) and the page (PoesIA) on this machine. With your own Apertus endpoint:
# LLM_BASE_URL=... docker compose up --no-deps web. See README.md.
name: poesia-apertus
services:
  ollama:
    image: ollama/ollama:0.34.4
    environment:
      OLLAMA_KEEP_ALIVE: 24h  # keep Apertus in memory between suggestions
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      retries: 30

  web:
    build:
      context: .
      dockerfile: src/Dockerfile
    depends_on:
      ollama:
        condition: service_healthy
        required: false  # absent when the page runs against your own endpoint
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_NAME: ${LLM_NAME:-poesia-apertus}
      LLM_API_KEY: ${LLM_API_KEY:-}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-${LLM_BASE_URL:-http://ollama:11434/v1}}
      EMBED_NAME: ${EMBED_NAME:-poesia-embed}
      # First run: the page pulls and prepares the models on this Ollama and shows progress.
      # "off" with your own endpoint (run.sh / run.ps1 set it).
      POESIA_SETUP_OLLAMA: ${POESIA_SETUP_OLLAMA:-http://ollama:11434}
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  ollama:
